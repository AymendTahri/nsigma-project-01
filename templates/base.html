<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}lebonimag{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF7F2] text-stone-900 min-h-screen flex flex-col">

  <header class="border-b border-stone-200/80">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/" class="text-xl font-bold tracking-tight">lebonimag</a>
      <a href="/ajouter" class="bg-[#C2410C] hover:bg-[#9A3412] text-white text-sm font-medium px-4 py-2 rounded-lg">
        Déposer une annonce
      </a>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto px-4 py-6 flex-1">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
