{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-xl shadow border border-gray-200">
  <h1 class="text-2xl font-bold mb-6 text-gray-900">Inscription</h1>

  <form method="POST" action="{{ url_for('inscription') }}">
    <div class="mb-4">
      <label for="name" class="block text-sm font-medium text-gray-700">Nom</label>
      <input type="text" id="name" name="name"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A300] focus:border-[#00A300]"
             required>
    </div>
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" id="email" name="email"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A300] focus:border-[#00A300]"
             required>
    </div>


    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700">Mot de passe</label>
      <input type="password" id="password" name="password"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A300] focus:border-[#00A300]"
             required>
    </div>
    <div class="mb-6">
      <label for="password_confirmation" class="block text-sm font-medium text-gray-700">Confirmer le mot de passe</label>
      <input type="password" id="password_confirmation" name="password_confirmation"
             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-[#00A300] focus:border-[#00A300]"
             required>
    </div>

    <button type="submit"
            class="w-full bg-[#00A300] hover:bg-[#008500] text-white text-sm font-medium px-4 py-2.5 rounded-lg transition">
      Créer un compte
    </button>
  </form>

  <p class="text-sm text-gray-600 mt-4 text-center">
    Déjà inscrit ?
    <a href="/connexion" class="text-[#00A300] font-medium hover:underline">Se connecter</a>
  </p>
</div>
{% endblock %}
